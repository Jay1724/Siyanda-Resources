name: Update metal prices

# metals.dev's free plan has a small monthly request quota, so this runs three
# times on weekdays (markets are closed at weekends). Run it manually any time.
on:
  schedule:
    - cron: "0 6,12,18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-prices

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch prices
        env:
          METALS_DEV_API_KEY: ${{ secrets.METALS_DEV_API_KEY }}
        run: python3 scripts/update_prices.py
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/prices.json
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Update metal prices"
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
